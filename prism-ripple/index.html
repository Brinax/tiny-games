<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prism Ripple</title>
<style>
html,body{margin:0;height:100%;background:#0b0820;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#mute{position:fixed;top:10px;right:10px;z-index:5;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:20px;width:44px;height:44px;border-radius:22px}
#fun{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,3,20,.7);z-index:6}
#fun .box{background:#1d1640;padding:22px 26px;border-radius:16px;text-align:center;max-width:300px}
#fun button{font-size:18px;margin:8px;padding:10px 22px;border:0;border-radius:10px;color:#0b0820;font-weight:700}
#fun .x{background:none;color:#aaa;font-size:14px;font-weight:400}
.ui{position:fixed;left:50%;transform:translateX(-50%);z-index:4;display:none;gap:10px}
.ui button{font:800 17px system-ui,sans-serif;padding:12px 20px;border:0;border-radius:12px;cursor:pointer;white-space:nowrap}
#dailyBtn{background:#c9b8ff;color:#0b0820}
#shareBtn{background:#7fffd4;color:#0b0820}
#modeBtn{background:rgba(255,255,255,.14);color:#fff}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#fff;color:#0b0820;font:700 15px system-ui,sans-serif;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:7;pointer-events:none}
#toast.show{opacity:1}
</style>
<script data-goatcounter="https://tinygames.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Toggle sound">🔊</button>
<div class="ui" id="readyUi"><button id="dailyBtn">Daily Challenge</button></div>
<div class="ui" id="overUi"><button id="shareBtn">Share</button><button id="modeBtn">Daily</button></div>
<div id="fun"><div class="box"><div style="font-size:20px;margin-bottom:10px">Was this fun?</div>
<button id="funYes" style="background:#7fffd4">Yes</button><button id="funNo" style="background:#ff8fa3">No</button><br>
<button class="x" id="funX">not now</button></div></div>
<script src="social.js"></script>
<script src="game.js"></script>
</body>
</html>
